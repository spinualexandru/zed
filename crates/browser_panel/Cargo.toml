[package]
name = "browser_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/browser_panel.rs"
doctest = false

[features]
default = []
# Enable full Servo browser engine (requires ~30min build time and system dependencies)
# See README.md for setup instructions
servo-browser = ["dep:libservo", "dep:glutin"]

[dependencies]
anyhow.workspace = true
collections.workspace = true
db.workspace = true
editor.workspace = true
futures.workspace = true
gpui.workspace = true
log.workspace = true
menu.workspace = true
parking_lot.workspace = true
raw-window-handle = "0.6"
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
smol.workspace = true
ui.workspace = true
ui_input.workspace = true
url = "2.5"
urlencoding = "2.1"
util.workspace = true
workspace.workspace = true
zed_actions.workspace = true

# Optional dependencies for Servo browser engine
# Note: Servo is not on crates.io, so we use a git dependency
# Update the 'rev' to match the latest Servo commit hash
libservo = { git = "https://github.com/servo/servo", rev = "3f69ef2303dd2", optional = true, package = "servo" }
glutin = { version = "0.31", optional = true }
